# Catalog of NEON data products used by this project.
#
# download_neon_product.py reads this file to resolve a product alias (or
# raw NEON product id) to: which folder it belongs in, which neonutilities
# table holds the actual sensor readings, and what native averaging
# interval that table publishes at. Add a new entry here before pulling a
# new product -- don't hardcode product details into the script.
#
# Fields:
#   id            NEON data product code (DP#.#####.###)
#   aliases       short names this product can be referred to by on the CLI
#   folder        raw/ subfolder this product's combined CSV is written to
#   data_type     human-readable description
#   file_match    name of the neonutilities-stacked table holding the
#                 sensor readings (neonutilities returns a dict of tables
#                 per product; this picks the right one out of it)
#   interval_min  native averaging interval of that table, in minutes
#                 (passed to neonutilities as `timeindex`)
#   notes         anything non-obvious about this product (deprecations,
#                 site-specific quirks, etc.)
#
# The 11 core sensor product entries and the DP4.00200.001 eddy covariance
# entry below are copied unchanged from neon_CPER/neon_CLBJ -- NEON product
# catalog entries aren't site-specific, --site is passed at download time.
# Site-specific details (actual availableMonths, sensor position layout,
# provisional-data cutoff) are NOT baked in here; run
# scripts/neon_site_availability.py --site OSBS and check pulled data's
# own position columns instead of assuming CPER's/CLBJ's numbers apply.

products:
  - id: DP1.00002.001
    aliases: [air_temperature, airtemp, saat]
    folder: raw/air_temperature
    data_type: Single Aspirated Air Temperature
    file_match: SAAT_30min
    interval_min: 30

  - id: DP1.00094.001
    aliases: [soil_moisture, soilmoisture, swc]
    folder: raw/soil_moisture
    data_type: Soil Water Content
    file_match: SWS_30_minute
    interval_min: 30

  - id: DP1.00041.001
    aliases: [soil_temperature, soiltemp, st]
    folder: raw/soil_temperature
    data_type: Soil Temperature
    file_match: ST_30_minute
    interval_min: 30

  - id: DP1.00044.001
    aliases: [precipitation, precip, weiprep]
    folder: raw/precipitation
    data_type: Precipitation - Weighing Gauge
    file_match: WEIPRE_60min
    interval_min: 60
    notes: >
      DP1.00006.001 ("Precipitation") was deprecated by NEON and split
      into DP1.00044.001 (weighing gauge), DP1.00045.001 (tipping
      bucket), DP1.00046.001 (throughfall). Inherited from CLBJ/CPER as
      the direct successor to the old bulk precipitation product --
      confirm OSBS actually publishes DP1.00044.001 specifically (not
      just tipping-bucket or throughfall) via
      neon_site_availability.py before relying on this alias; this
      hasn't been re-checked against OSBS's own product list yet.
      Publishes at 60-minute/daily resolution only, no 30-minute table.

  - id: DP1.00023.001
    aliases: [radiation_net, netradiation, net_radiation, nr]
    folder: raw/radiation
    data_type: Net Radiation
    file_match: SLRNR_30min
    interval_min: 30

  - id: DP1.00024.001
    aliases: [radiation_par, par]
    folder: raw/radiation
    data_type: Photosynthetically Active Radiation (PAR)
    file_match: PARPAR_30min
    interval_min: 30

  - id: DP1.00098.001
    aliases: [relative_humidity, RH, "relative humidity"]
    folder: raw/humidity
    data_type: Relative Humidity
    file_match: RH_30min
    interval_min: 30

  - id: DP1.00004.001
    aliases: [barometric_pressure, "barometric pressure", "air pressure", "surface pressure"]
    folder: raw/pressure
    data_type: Barometric Pressure
    file_match: BP_30min
    interval_min: 30

  - id: DP1.00001.001
    aliases: [wind, "wind speed", "wind direction"]
    folder: raw/wind
    data_type: 2D Wind Speed and Direction
    file_match: 2DWSD_30min
    interval_min: 30
    notes: >
      Speed and direction are both fields in the same stacked table
      (2DWSD_30min) -- no separate table/product for each.

  - id: DP1.00040.001
    aliases: [soil_heat_flux, "soil heat flux", shf]
    folder: raw/soil_heat_flux
    data_type: Soil Heat Flux Plate
    file_match: SHF_30min
    interval_min: 30

  - id: DP1.00095.001
    aliases: [soil_co2, "soil CO2", "soil carbon dioxide"]
    folder: raw/soil_co2
    data_type: Soil CO2 Concentration
    file_match: SCO2C_30_minute
    interval_min: 30
    notes: >
      Actual neonutilities stacked table name is SCO2C_30_minute (not
      SCO2C_30min) -- a CLBJ/CPER finding, inherited here unverified for
      OSBS. Re-check if download_one() reports a "table not found" error.

  # -- PhenoCam Network entries below are pulled by
  # scripts/download_phenocam_gcc.py, NOT download_neon_product.py -- they
  # come from phenocam.nau.edu's own archive, not NEON's /data API, so
  # they have no NEON dpid, interval_min, or neonutilities table name.
  #
  # OSBS has far more ROI codes than CPER/CLBJ for both products. Verified
  # by directly pandas.read_csv()-ing every *_1day.csv on 2026-10-05 (real
  # parse, not a summarized fetch -- an earlier AI-summarized pass on the
  # same URLs gave unreliable/inconsistent numbers, which is why this was
  # redone properly):
  #   - NEON.D03.OSBS.DP1.00033 (canopy): EN_0001/EN_0002 (453 rows,
  #     2016-12-14 -> 2018-03-11, retired together, like CPER's
  #     GR_0001/0002/0003); EN_1000/EN_1001/EN_1002 (~3358 rows,
  #     2016-12-15 -> 2026-02-23, essentially gap-free -- the real
  #     long-running generation, three near-identical concurrent ROIs
  #     within it); EN_2000/EN_2001/EN_2002 (201 rows, 2026-03-18 ->
  #     present -- a NEW generation picking up just 23 days after
  #     EN_1000 stops, a genuine sequential hand-off like CLBJ's
  #     DB_1000->2000->3000); XX_1000 (1023 rows, 2016-12-14 ->
  #     2019-10-02, an unrelated shorter series).
  #   - NEON.D03.OSBS.DP1.00042 (understory): GR_1000 (3283 rows,
  #     2016-12-14 -> 2025-12-09, the real long-running series);
  #     GR_1001 (6 rows only, 2023-05 test/anomaly, ignore); GR_2000
  #     (263 rows, 2026-01-15 -> present -- hand-off from GR_1000, ~5
  #     week gap at the seam); UN_0001 (453 rows, 2016-12-14 ->
  #     2018-03-11 only -- despite the semantically-fitting name, this
  #     is the SHORT retired-in-2018 series, analogous to CPER's
  #     abandoned understory camera, NOT the best full-history choice);
  #     XX_1000/XX_2000 (both 1023 rows, 2016-12-14 -> 2019-10-02,
  #     identical to canopy's XX_1000 -- likely a shared/reused
  #     unclassified-ROI definition, not used here).
  # download_phenocam_gcc.py's `rois:` list stitches sequential
  # generations chronologically (same mechanism as CLBJ's canopy entry)
  # -- used below for both OSBS entries to cover the 2026 hand-off gap.

  - id: NEON.D03.OSBS.DP1.00033
    aliases: [phenocam_canopy, canopy_phenocam]
    folder: raw/phenocam/canopy
    data_type: csv
    source: phenocam_network
    base_url: https://phenocam.nau.edu/data/archive
    rois: [EN_1000, EN_2000]
    file_match: "{site}_{roi}_1day.csv"
    priority: secondary
    notes: >
      Verified live via direct pandas.read_csv() on 2026-10-05 (see
      catalog header above). EN_1000 covers 2016-12-15 -> 2026-02-23
      (gap-free, 3358 rows); EN_2000 picks up 2026-03-18 -> present
      (201 rows) -- a genuine sequential ROI hand-off, not overlapping
      duplicates like EN_0001/0002 or a one-off like XX_1000. Stitched
      via `rois:` the same way CLBJ's canopy camera stitches
      DB_1000/2000/3000. Only a ~23-day gap at the hand-off seam.

  - id: NEON.D03.OSBS.DP1.00042
    aliases: [phenocam_understory, understory_phenocam]
    folder: raw/phenocam/understory
    data_type: csv
    source: phenocam_network
    base_url: https://phenocam.nau.edu/data/archive
    rois: [GR_1000, GR_2000]
    file_match: "{site}_{roi}_1day.csv"
    priority: primary
    notes: >
      Verified live via direct pandas.read_csv() on 2026-10-05 (see
      catalog header above). GR_1000 covers 2016-12-14 -> 2025-12-09
      (3283 rows); GR_2000 picks up 2026-01-15 -> present (263 rows) --
      a genuine sequential hand-off, ~5-week gap at the seam. NOTE:
      UN_0001 looked like the semantically-obvious pick (name matches
      "understory") but is actually the short series that stopped in
      2018-03-11 (same pattern as CPER's abandoned understory camera)
      -- GR_1000+GR_2000 gives far better coverage and was used instead.
      Don't assume the "UN"-prefixed ROI is always the right one to use
      for this product/role; check actual date ranges, not the name.

  # -- Eddy covariance, pulled by scripts/download_eddy_covariance.py, NOT
  # download_neon_product.py. Delivered as HDF5 bundles rather than the
  # CSV/table-per-product format every other NEON entry here uses, so it
  # needs neonutilities.zips_by_product() + stack_eddy() instead of
  # load_by_product() -- there is no single stacked "table name" to put
  # in file_match, hence no file_match/interval_min fields here. Entry
  # copied unchanged from CPER/CLBJ -- see scripts/download_eddy_covariance.py
  # and neon_site_availability.py --site OSBS for OSBS's own actual
  # availableMonths range before a real pull (not checked yet here).

  - id: DP4.00200.001
    name: "Bundled Eddy Covariance (Net Ecosystem Exchange, fluxes)"
    aliases: ["eddy covariance", EC, "flux data", NEE, "net ecosystem exchange"]
    folder: raw/eddy_covariance
    data_type: hdf5_eddy
    notes: >
      Delivered as HDF5, not CSV -- requires neonutilities.stack_eddy()
      to convert to tabular format, not the standard load_by_product()
      CSV path used for every other product in this catalog. Download
      with zips_by_product() (package="basic"), then
      stack_eddy(filepath=<download folder>, level="dp04") for final
      30-min flux values. zips_by_product() saves one zip per site-month
      under <savepath>/filesToStack00200/ -- point stack_eddy() at
      <savepath> itself, not at the zip files directly.

      There is no single flat "qfFinl" column in the stacked dp04 table
      -- there are 11, one per flux term/stage (e.g.
      qfqm.fluxCo2.nsae.qfFinl, qfqm.fluxH2o.turb.qfFinl, ...).
      download_eddy_covariance.py filters only on
      qfqm.fluxCo2.nsae.qfFinl == 0 ("nsae" = net surface-atmosphere
      exchange = NEE) and leaves the other 10 untouched.

      Also requires pandas<3 in the venv -- see scripts/requirements.txt.

      PULLED for OSBS on 2026-10-05: requested 2017-02 -> 2026-08 (115
      site-months); zips_by_product() actually returned 101 site-months
      (same provisional-ish cutoff pattern as the other 11 products).
      Of those 101, the 2017-02 file crashed stack_eddy() with
      `ValueError: setting an array element with a sequence... detected
      shape was (101,) + inhomogeneous part` -- that file's generation
      timestamp (20221215T020221Z) is far older than every other month's
      (all 20260115Txxxxxx or later), meaning it was produced under an
      older NEON processing schema with a different column layout that
      the current neonutilities (2.0.1) can't merge alongside the newer
      files. NOT a disk/token/network issue -- re-downloading it changes
      nothing; it genuinely has an incompatible schema. Worked around by
      excluding that one file from the staging dir before stacking the
      remaining 100 (2017-03 -> 2025-06-30, 146,112 unfiltered rows).
      After the standard NEE QC filter, only 30,988 rows survive, and
      notably the QC-passing rows don't start until 2019-09-15 -- every
      row from 2017-03 through 2019-09-14 was flagged bad by
      qfqm.fluxCo2.nsae.qfFinl, not merely absent. If OSBS's eddy
      covariance is ever re-pulled, expect the same 2017-02 failure and
      apply the same fix (gunzip the lone .h5.gz if needed, move the
      oldest-generation-timestamp file out of the staging dir, re-run
      stack_eddy on the rest) rather than assuming the whole pull is
      broken.
